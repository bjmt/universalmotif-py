[package]
name = "universalmotif-py"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# The crate next door during development, and the published version for
# builds from a source distribution.
universalmotif = { version = "0.3.0", path = "../universalmotif-rs" }
arrow-array = "59"
arrow-schema = "59"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-arrow = { version = "0.20", default-features = false }
rand = "0.10.3"

[profile.release]
strip = true
