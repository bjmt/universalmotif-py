site_name: universalmotif
site_description: Sequence motif manipulation and analysis in Python, a port of the universalmotif R package
repo_url: https://github.com/bjmt/universalmotif-py
repo_name: bjmt/universalmotif-py
copyright: Benjamin Jean-Marie Tremblay

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocs-jupyter:
      # Only notebooks. Markdown pages are left to MkDocs (and ignoring them,
      # rather than only including notebooks, keeps the plugin from reading
      # them with pandoc first).
      include: ["*.ipynb"]
      ignore: ["*.md"]
      # MkDocs renders the notebooks' text, so links to the reference work.
      markdown_cell_processor: mkdocs
      execute: true
      include_source: true
      allow_errors: false
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      # The differences from the R package are kept with the Rust crate,
      # which is checked out next to this repository.
      base_path: [".", ".."]
      check_paths: true

# The API reference comes from the docstrings, so rebuild when they change.
watch:
  - python/universalmotif

nav:
  - Home: index.md
  - Installation: installation.md
  - Guides:
      - Getting started: guides/getting-started.ipynb
  - API reference:
      - reference/index.md
      - Motifs: reference/motifs.md
      - Reading and writing: reference/io.md
      - P-values and scores: reference/scoring.md
      - Scanning: reference/scanning.md
      - Comparison and clustering: reference/comparison.md
      - Enrichment and discovery: reference/enrichment.md
      - Sequences: reference/sequences.md
      - Genomic intervals: reference/genomic.md
      - Plotting: reference/plotting.md
  - Differences from the R package: differences.md
  - Changelog: changelog.md
