site_name: universalmotif
site_description: Sequence motif manipulation and analysis in Python, a port of the universalmotif R package
repo_url: https://github.com/bjmt/universalmotif-py
repo_name: bjmt/universalmotif-py
copyright: Benjamin Jean-Marie Tremblay

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - hooks/notebooks.py

plugins:
  - search
  - mkdocs-jupyter:
      # Only notebooks. Markdown pages are left to MkDocs (and ignoring them,
      # rather than only including notebooks, keeps the plugin from reading
      # them with pandoc first).
      include: ["*.ipynb"]
      ignore: ["*.md"]
      # MkDocs renders the notebooks' text, so links to the reference work.
      markdown_cell_processor: mkdocs
      execute: true
      # These use downloaded data, so they were run once and kept with their
      # outputs.
      execute_ignore:
        - guides/background-models.ipynb
        - guides/chipseq-workflow.ipynb
        - guides/building-a-library.ipynb
      include_source: true
      allow_errors: false
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      # The differences from the R package are kept with the Rust crate,
      # which is checked out next to this repository.
      base_path: [".", ".."]
      check_paths: true

# The API reference comes from the docstrings, so rebuild when they change.
watch:
  - python/universalmotif

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Guides:
      - Getting started: guides/getting-started.ipynb
      - Sequence motifs: guides/motif-basics.ipynb
      - Working with motifs: guides/working-with-motifs.ipynb
      - Working with sequences: guides/sequences.ipynb
      - Scanning and enrichment: guides/scanning-and-enrichment.ipynb
      - Comparing motifs and P-values: guides/comparison-and-pvalues.ipynb
      - Choosing a background: guides/background-models.ipynb
      - Scanning large genomes: guides/large-genomes.ipynb
      - Gapped motifs and other alphabets: guides/gaps-and-alphabets.ipynb
      - A ChIP-seq workflow: guides/chipseq-workflow.ipynb
      - Building a motif library: guides/building-a-library.ipynb
  - API reference:
      - reference/index.md
      - Motifs: reference/motifs.md
      - Reading and writing: reference/io.md
      - P-values and scores: reference/scoring.md
      - Scanning: reference/scanning.md
      - Comparison and clustering: reference/comparison.md
      - Enrichment and discovery: reference/enrichment.md
      - Sequences: reference/sequences.md
      - Genomes and signal: reference/genomes.md
      - Genomic intervals: reference/genomic.md
      - Plotting: reference/plotting.md
      - Databases and Biopython: reference/databases.md
      - Deep learning: reference/deep.md
      - Example data: reference/data.md
  - Differences from the R package: differences.md
  - Changelog: changelog.md
