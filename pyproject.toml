[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "universalmotif"
version = "0.2.0"
description = "Sequence motif manipulation and analysis, a Python port of universalmotif"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Benjamin Jean-Marie Tremblay" }]
keywords = ["bioinformatics", "motif", "pwm", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "polars>=1.0"]

[project.urls]
Documentation = "https://bjmt.github.io/universalmotif-py/"
Repository = "https://github.com/bjmt/universalmotif-py"
Changelog = "https://bjmt.github.io/universalmotif-py/changelog/"
Issues = "https://github.com/bjmt/universalmotif-py/issues"

[project.scripts]
universalmotif = "universalmotif._cli:main"
umotif = "universalmotif._cli:main"

[project.optional-dependencies]
anndata = ["anndata>=0.10", "scipy>=1.11"]
bigwig = ["pybigtools>=0.3"]
biopython = ["biopython>=1.81"]
h5py = ["h5py>=3.0"]
pandas = ["pandas>=2.0", "pyarrow>=14"]
plot = ["matplotlib>=3.8"]
polars-bio = ["polars-bio>=0.36; python_version >= '3.11' and python_version < '3.15'"]
pyranges = ["pyranges1>=1.0; python_version >= '3.12'"]
scipy = ["scipy>=1.11"]

[dependency-groups]
dev = [
    "anndata>=0.10",
    "biopython>=1.81",
    "h5py>=3.0",
    "maturin>=1.9,<2",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "polars-bio>=0.36; python_version >= '3.11' and python_version < '3.15'",
    "pybigtools>=0.3",
    "pyranges1>=1.0; python_version >= '3.12'",
    "pytest>=8",
    "scipy>=1.15.3",
]
docs = [
    "maturin>=1.9,<2",
    "matplotlib>=3.8",
    # MkDocs 2 drops the plugin system these rely on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.maturin]
python-source = "python"
module-name = "universalmotif._core"
features = ["pyo3/extension-module"]
# The docs, guides and CI files are not needed to build or use the package.
exclude = [
    { path = "docs/**/*", format = "sdist" },
    { path = "hooks/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
    { path = "mkdocs.yml", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests", "python/universalmotif"]
# Docstring examples run as tests too.
addopts = "--doctest-modules"
# The package warns about inputs that silently give empty or odd results, so
# a warning in a test is an error unless the test expects it.
filterwarnings = ["error::UserWarning"]
