[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "universalmotif"
version = "0.1.0"
description = "Sequence motif manipulation and analysis, a Python port of universalmotif"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Benjamin Jean-Marie Tremblay" }]
keywords = ["bioinformatics", "motif", "pwm", "genomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "polars>=1.0"]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "scipy>=1.11"]
biopython = ["biopython>=1.81"]
pandas = ["pandas>=2.0", "pyarrow>=14"]
plot = ["matplotlib>=3.8"]
scipy = ["scipy>=1.11"]

[dependency-groups]
dev = [
    "anndata>=0.10",
    "biopython>=1.81",
    "maturin>=1.9,<2",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pytest>=8",
    "scipy>=1.15.3",
]
docs = [
    "maturin>=1.9,<2",
    "matplotlib>=3.8",
    # MkDocs 2 drops the plugin system these rely on.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.maturin]
python-source = "python"
module-name = "universalmotif._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/universalmotif"]
# Docstring examples run as tests too.
addopts = "--doctest-modules"
# The package warns about inputs that silently give empty or odd results, so
# a warning in a test is an error unless the test expects it.
filterwarnings = ["error::UserWarning"]
